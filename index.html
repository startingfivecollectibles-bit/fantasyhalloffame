const ALL_EXHIBITS = [...DATA.leagues, DATA.master];
const STORAGE_KEY = 'hof_unlocked_exhibits_v1';

/* =========================================================
   HELPERS
   ========================================================= */
function loadUnlocked() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveUnlocked(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function getManager(id) {
  return DATA.managers.find(m => m.id === id) || null;
}
function leagueSport(leagueId) {
  const l = DATA.leagues.find(l => l.id === leagueId);
  return l ? l.sport : null;
}
function isDualThreat(managerId) {
  const champRows = DATA.stats.filter(s => s.managerId === managerId && s.championships > 0);
  const sports = new Set(champRows.map(s => leagueSport(s.league)));
  return sports.has('Football') && sports.has('Baseball');
}
function computeStandings(exhibitId, includeAlumni) {
  let rows;
  if (exhibitId === 'master') {
    rows = DATA.managers.map(m => {
      const statRows = DATA.stats.filter(s => s.managerId === m.id);
      if (statRows.length === 0) return null;
      const agg = statRows.reduce((acc, s) => ({
        wins: acc.wins + s.wins,
        losses: acc.losses + s.losses,
        ties: acc.ties + s.ties,
        playoffWins: acc.playoffWins + s.playoffWins,
        playoffLosses: acc.playoffLosses + s.playoffLosses,
        championships: acc.championships + s.championships,
        seasonsActive: acc.seasonsActive + s.seasonsActive,
        active: acc.active || s.active,
      }), { wins: 0, losses: 0, ties: 0, playoffWins: 0, playoffLosses: 0, championships: 0, seasonsActive: 0, active: false });
      return { managerId: m.id, name: m.name, ...agg };
    }).filter(Boolean);
  } else {
    rows = DATA.stats.filter(s => s.league === exhibitId).map(s => {
      const m = getManager(s.managerId);
      return {
        managerId: s.managerId, name: m.name,
        wins: s.wins, losses: s.losses, ties: s.ties,
        playoffWins: s.playoffWins, playoffLosses: s.playoffLosses,
        championships: s.championships, seasonsActive: s.seasonsActive, active: s.active,
      };
    });
  }
  if (!includeAlumni) rows = rows.filter(r => r.active);
  rows.forEach(r => {
    const totalGames = r.wins + r.losses + r.ties;
    r.winPct = totalGames ? (r.wins + 0.5 * r.ties) / totalGames : 0;
    const totalPlayoff = r.playoffWins + r.playoffLosses;
    r.playoffWinPct = totalPlayoff ? r.playoffWins / totalPlayoff : 0;
    r.isDualThreat = isDualThreat(r.managerId);
  });
  rows.sort((a, b) => b.winPct - a.winPct);
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}
function getH2H(aId, bId) {
  const entry = DATA.h2h.find(h => (h.a === aId && h.b === bId) || (h.a === bId && h.b === aId));
  if (!entry) return null;
  if (entry.a === aId) return entry;
  return {
    a: aId, b: bId,
    aWins: entry.bWins, bWins: entry.aWins, ties: entry.ties,
    aPlayoffWins: entry.bPlayoffWins, bPlayoffWins: entry.aPlayoffWins,
    aPoints: entry.bPoints, bPoints: entry.aPoints,
  };
}
function getRivals(managerId) {
  let nemesis = null, nemesisLosses = -1, victim = null, victimWins = -1;
  DATA.h2h.forEach(h => {
    let oppId, myWins, myLosses;
    if (h.a === managerId) { oppId = h.b; myWins = h.aWins; myLosses = h.bWins; }
    else if (h.b === managerId) { oppId = h.a; myWins = h.bWins; myLosses = h.aWins; }
    else return;
    if (myLosses > nemesisLosses) { nemesisLosses = myLosses; nemesis = oppId; }
    if (myWins > victimWins) { victimWins = myWins; victim = oppId; }
  });
  return {
    nemesis: nemesis ? getManager(nemesis) : null, nemesisLosses,
    victim: victim ? getManager(victim) : null, victimWins,
  };
}
function pct(n) { return (n * 100).toFixed(1) + '%'; }
function managersForExhibit(exhibitId) {
  if (exhibitId === 'master') return DATA.managers;
  const ids = new Set(DATA.stats.filter(s => s.league === exhibitId).map(s => s.managerId));
  return DATA.managers.filter(m => ids.has(m.id));
}

/* =========================================================
   SMALL UI PIECES
   ========================================================= */
function TrophyCount({ count }) {
  if (count <= 0) return <span className="text-amber-100/30">—</span>;
  const shown = Math.min(count, 5);
  return (
    <span className="whitespace-nowrap">
      <span>{'🏆'.repeat(shown)}</span>
      {count > 5 && <span className="text-amber-300 ml-1">x{count}</span>}
    </span>
  );
}
function RankBadge({ rank }) {
  if (rank === 1) return <span title="Hall of Fame Inductee" className="text-lg">👑</span>;
  if (rank === 2) return <span className="text-lg">🥈</span>;
  if (rank === 3) return <span className="text-lg">🥉</span>;
  return <span className="text-amber-100/50">#{rank}</span>;
}
function Badge({ children, className }) {
  return (
    <span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-wide border " + className}>
      {children}
    </span>
  );
}

/* =========================================================
   PIN MODAL
   ========================================================= */
function PinModal({ exhibit, onClose, onSuccess }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState('');

  function submit(e) {
    e.preventDefault();
    if (value === exhibit.pin) {
      onSuccess(exhibit);
    } else {
      setError('Incorrect Access Code');
      setValue('');
    }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
      <div className="w-full max-w-sm plaque-texture border border-amber-400/40 rounded-lg shadow-gold-glow-lg p-6 relative">
        <button onClick={onClose} className="absolute top-3 right-3 text-amber-200/50 hover:text-amber-200 text-xl leading-none">×</button>
        <div className="text-center mb-5">
          <div className="text-3xl mb-2">🔒</div>
          <h2 className="font-serif text-xl text-amber-200 tracking-wide">Enter Vault Access Code</h2>
          <p className="text-amber-100/50 text-sm mt-1">{exhibit.name}</p>
        </div>
        <form onSubmit={submit} className="space-y-4">
          <input
            autoFocus
            type="password"
            inputMode="numeric"
            maxLength="4"
            value={value}
            onChange={e => { setValue(e.target.value.replace(/\D/g, '')); setError(''); }}
            className="w-full text-center tracking-[1em] text-2xl bg-black/50 border border-amber-400/40 rounded-md py-3 text-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-400/60"
            placeholder="••••"
          />
          {error && <p className="text-red-400 text-sm text-center">{error}</p>}
          <button
            type="submit"
            disabled={value.length !== 4}
            className="w-full bg-gradient-to-b from-amber-400 to-amber-600 disabled:opacity-30 disabled:cursor-not-allowed text-obsidian font-serif font-bold py-2.5 rounded-md tracking-wide hover:brightness-110 transition"
          >
            Unlock Exhibit
          </button>
        </form>
      </div>
    </div>
  );
}

/* =========================================================
   RIVALRY TOOL
   ========================================================= */
function RivalryTool({ managers }) {
  const [aId, setAId] = useState('');
  const [bId, setBId] = useState('');
  const h2h = (aId && bId && aId !== bId) ? getH2H(aId, bId) : null;
  const mA = getManager(aId), mB = getManager(bId);

  function Select({ value, onChange, exclude }) {
    return (
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        className="w-full bg-black/50 border border-amber-400/30 rounded-md px-3 py-2 text-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-400/50"
      >
        <option value="">Select manager…</option>
        {managers.filter(m => m.id !== exclude).map(m => (
          <option key={m.id} value={m.id}>{m.name}</option>
        ))}
      </select>
    );
  }

  return (
    <div className="mt-10">
      <h3 className="font-serif text-xl text-amber-200 mb-4 flex items-center gap-2">⚔️ Head-to-Head Rivalry Comparison</h3>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 max-w-xl">
        <Select value={aId} onChange={setAId} exclude={bId} />
        <Select value={bId} onChange={setBId} exclude={aId} />
      </div>

      {(!aId || !bId) && <p className="text-amber-100/40 italic text-sm">Select two managers to compare their rivalry.</p>}
      {aId && bId && aId === bId && <p className="text-red-400 text-sm">Choose two different managers.</p>}

      {h2h && (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl">
          {[
            { m: mA, wins: h2h.aWins, losses: h2h.bWins, pw: h2h.aPlayoffWins, pl: h2h.bPlayoffWins, pts: h2h.aPoints },
            { m: mB, wins: h2h.bWins, losses: h2h.aWins, pw: h2h.bPlayoffWins, pl: h2h.aPlayoffWins, pts: h2h.bPoints },
          ].map((side, i) => {
            const total = side.wins + side.losses;
            const winPct = total ? side.wins / total : 0;
            return (
              <div key={i} className="plaque-texture border border-amber-400/30 rounded-lg p-5 shadow-gold-glow">
                <h4 className="font-serif text-lg text-amber-100 mb-3">{side.m.name}</h4>
                <dl className="space-y-2 text-sm">
                  <div className="flex justify-between"><dt className="text-amber-100/50">Overall H2H Record</dt><dd className="text-amber-200 font-semibold">{side.wins}-{side.losses}</dd></div>
                  <div className="flex justify-between"><dt className="text-amber-100/50">H2H Win %</dt><dd className="text-amber-200 font-semibold">{pct(winPct)}</dd></div>
                  <div className="flex justify-between"><dt className="text-amber-100/50">Playoff H2H</dt><dd className="text-amber-200 font-semibold">{side.pw}-{side.pl}</dd></div>
                  <div className="flex justify-between"><dt className="text-amber-100/50">Total Points Scored</dt><dd className="text-amber-200 font-semibold">{side.pts.toLocaleString()}</dd></div>
                </dl>
              </div>
            );
          })}
        </div>
      )}
      {aId && bId && aId !== bId && !h2h && (
        <p className="text-amber-100/40 italic text-sm">These managers have never faced each other.</p>
      )}
    </div>
  );
}

/* =========================================================
   MANAGER PLAQUE MODAL
   ========================================================= */
function ManagerPlaqueModal({ managerId, onClose }) {
  const m = getManager(managerId);
  if (!m) return null;
  const statRows = DATA.stats.filter(s => s.managerId === managerId);
  const totalChampionships = statRows.reduce((a, s) => a + s.championships, 0);
  const dual = isDualThreat(managerId);
  const { nemesis, nemesisLosses, victim, victimWins } = getRivals(managerId);
  const leagueNames = statRows.map(s => DATA.leagues.find(l => l.id === s.league).name);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
      <div className="w-full max-w-lg plaque-texture border-2 border-amber-400/50 rounded-lg shadow-gold-glow-lg p-7 relative max-h-[90vh] overflow-y-auto">
        <button onClick={onClose} className="absolute top-3 right-3 text-amber-200/50 hover:text-amber-200 text-xl leading-none">×</button>

        <div className="text-center mb-6 border-b border-amber-400/20 pb-6">
          <div className="text-3xl mb-2">🏅</div>
          <h2 className="font-serif text-2xl text-amber-100">{m.name}</h2>
          <p className="text-amber-100/40 text-xs mt-1 uppercase tracking-wide">{leagueNames.join(' · ')}</p>
          <div className="flex justify-center gap-2 mt-3">
            {dual && <Badge className="border-fuchsia-300/40 text-fuchsia-200 bg-fuchsia-400/10">Dual-Threat</Badge>}
            <Badge className="border-amber-300/50 text-amber-200 bg-amber-400/10"><TrophyCount count={totalChampionships} /> Titles</Badge>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
          <div className="bg-black/30 border border-amber-400/20 rounded-md p-4">
            <p className="text-amber-100/40 text-[11px] uppercase tracking-wide mb-1">Best Single Season</p>
            <p className="font-serif text-amber-200 text-lg">{m.bestSeason.record}</p>
            <p className="text-amber-100/50 text-xs mt-1">{m.bestSeason.year} · {DATA.leagues.find(l => l.id === m.bestSeason.league).name}</p>
          </div>
          <div className="bg-black/30 border border-amber-400/20 rounded-md p-4">
            <p className="text-amber-100/40 text-[11px] uppercase tracking-wide mb-1">Career Championships</p>
            <p className="font-serif text-amber-200 text-lg"><TrophyCount count={totalChampionships} /></p>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div className="bg-red-950/20 border border-red-400/20 rounded-md p-4">
            <p className="text-red-300/70 text-[11px] uppercase tracking-wide mb-1">😈 Nemesis</p>
            {nemesis ? (
              <React.Fragment>
                <p className="font-serif text-red-200 text-lg">{nemesis.name}</p>
                <p className="text-red-200/50 text-xs mt-1">{nemesisLosses} career losses suffered</p>
              </React.Fragment>
            ) : <p className="text-amber-100/30 text-sm italic">No rivals recorded</p>}
          </div>
          <div className="bg-emerald-950/20 border border-emerald-400/20 rounded-md p-4">
            <p className="text-emerald-300/70 text-[11px] uppercase tracking-wide mb-1">🎯 Victim</p>
            {victim ? (
              <React.Fragment>
                <p className="font-serif text-emerald-200 text-lg">{victim.name}</p>
                <p className="text-emerald-200/50 text-xs mt-1">{victimWins} career wins earned</p>
              </React.Fragment>
            ) : <p className="text-amber-100/30 text-sm italic">No rivals recorded</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   EXHIBIT VIEW
   ========================================================= */
function ExhibitView({ exhibit, includeAlumni, setIncludeAlumni, onSelectManager }) {
  const rows = useMemo(() => computeStandings(exhibit.id, includeAlumni), [exhibit.id, includeAlumni]);
  const managers = managersForExhibit(exhibit.id);
  const isMaster = exhibit.id === 'master';

  return (
    <div className="max-w-6xl mx-auto px-4 py-10">
      <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8">
        <div>
          <p className="text-amber-300/50 text-xs uppercase tracking-widest mb-1">{isMaster ? 'Master Exhibit' : exhibit.sport + ' League'}</p>
          <h2 className="font-serif text-3xl text-amber-100">{exhibit.name}</h2>
        </div>
        <label className="flex items-center gap-3 bg-black/30 border border-amber-400/20 rounded-full px-4 py-2 select-none cursor-pointer">
          <span className={"text-xs " + (!includeAlumni ? "text-amber-200 font-semibold" : "text-amber-100/40")}>Active Members</span>
          <span
            onClick={() => setIncludeAlumni(!includeAlumni)}
            className={"relative inline-flex h-5 w-9 items-center rounded-full transition " + (includeAlumni ? "bg-amber-500" : "bg-amber-100/20")}

            <span className={"inline-block h-4 w-4 transform rounded-full bg-obsidian transition " + (includeAlumni ? "translate-x-5" : "translate-x-1")} />
          </span>
          <span className={"text-xs " + (includeAlumni ? "text-amber-200 font-semibold" : "text-amber-100/40")}>All-Time (Alumni)</span>
        </label>
      </div>

      <StandingsTable rows={rows} onSelectManager={onSelectManager} />
      <RivalryTool managers={managers} />

/* =========================================================
   HEADER / TABS
   ========================================================= */
function Header({ unlocked, currentId, onSwitch, onLock, onGoLobby }) {
  const tabs = ALL_EXHIBITS.filter(ex => unlocked.includes(ex.id));
  return (
    <div className="sticky top-0 z-40 bg-obsidian/90 backdrop-blur border-b border-amber-400/20">
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <button onClick={onGoLobby} className="font-serif text-amber-200 text-sm tracking-wide flex items-center gap-2 hover:text-amber-100">
          🏛️ <span className="hidden sm:inline">Hall of Fame</span>
        </button>
        <div className="flex items-center gap-1 overflow-x-auto">
          {tabs.map(ex => (
            <button
              key={ex.id}
              onClick={() => onSwitch(ex.id)}
              className={
                "px-3 py-1.5 rounded-md text-xs font-serif tracking-wide whitespace-nowrap transition border " +
                (currentId === ex.id
                  ? "bg-amber-400/15 border-amber-400/50 text-amber-200"
                  : "border-transparent text-amber-100/50 hover:text-amber-200 hover:border-amber-400/20")
              }
            >
              {ex.id === 'master' ? '👑 ' : ''}{ex.name}
            </button>
          ))}
        </div>
        <button
          onClick={onLock}
          className="text-xs border border-amber-400/30 text-amber-200/70 hover:text-amber-100 hover:border-amber-400/60 rounded-md px-3 py-1.5 whitespace-nowrap"
        >
          🔒 Lock / Change Vault
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [unlocked, setUnlocked] = useState(loadUnlocked());
  const [view, setView] = useState(() => {
    const u = loadUnlocked();
    if (u.length === 0) return null;
    return u.includes('master') ? 'master' : u[0];
  });
  const [pinTarget, setPinTarget] = useState(null);
  const [includeAlumni, setIncludeAlumni] = useState(false);
  const [selectedManager, setSelectedManager] = useState(null);

  function handleUnlockSuccess(exhibit) {
    let next;
    if (exhibit.id === 'master') {
      next = Array.from(new Set([...unlocked, ...ALL_EXHIBITS.map(e => e.id)]));
    } else {
      next = Array.from(new Set([...unlocked, exhibit.id]));
    }
    setUnlocked(next);
    saveUnlocked(next);
    setView(exhibit.id);
    setPinTarget(null);
  }

  function handleSelectExhibit(exhibit) {
    if (unlocked.includes(exhibit.id)) {
      setView(exhibit.id);
    } else {
      setPinTarget(exhibit);
    }
  }

  function handleLock() {
    localStorage.removeItem(STORAGE_KEY);
    setUnlocked([]);
    setView(null);
  }

  const currentExhibit = ALL_EXHIBITS.find(e => e.id === view) || null;

  return (
    <div className="min-h-screen">
      {unlocked.length > 0 && (
        <Header
          unlocked={unlocked}
          currentId={view}
          onSwitch={setView}
          onLock={handleLock}
          onGoLobby={() => setView(null)}
        />
      )}

      {(!view || !currentExhibit) ? (
        <Lobby unlocked={unlocked} onSelect={handleSelectExhibit} />
      ) : (
        <ExhibitView
          exhibit={currentExhibit}
          includeAlumni={includeAlumni}
          setIncludeAlumni={setIncludeAlumni}
          onSelectManager={setSelectedManager}
        />
      )}

      {pinTarget && (
        <PinModal
          exhibit={pinTarget}
          onClose={() => setPinTarget(null)}
          onSuccess={handleUnlockSuccess}
        />
      )}

      {selectedManager && (
        <ManagerPlaqueModal
          managerId={selectedManager}
          onClose={() => setSelectedManager(null)}
        />
      )}

      <footer className="text-center text-amber-100/20 text-xs py-10">
        Fantasy Sports Hall of Fame & Museum — Est. this season · All records are self-contained, no server required.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
