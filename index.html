const ALL_EXHIBITS = [...DATA.leagues, DATA.master];
const STORAGE_KEY = 'hof_unlocked_exhibits_v1';

/* =========================================================
   HELPERS
   ========================================================= */
function loadUnlocked() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveUnlocked(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function getManager(id) {
  return DATA.managers.find(m => m.id === id) || null;
}
function leagueSport(leagueId) {
  const l = DATA.leagues.find(l => l.id === leagueId);
  return l ? l.sport : null;
}
function isDualThreat(managerId) {
  const champRows = DATA.stats.filter(s => s.managerId === managerId && s.championships > 0);
  const sports = new Set(champRows.map(s => leagueSport(s.league)));
  return sports.has('Football') && sports.has('Baseball');
}
function computeStandings(exhibitId, includeAlumni) {
  let rows;
  if (exhibitId === 'master') {
    rows = DATA.managers.map(m => {
      const statRows = DATA.stats.filter(s => s.managerId === m.id);
      if (statRows.length < 2) return null; // Master exhibit: only multi-league managers
      const agg = statRows.reduce((acc, s) => ({
        wins: acc.wins + s.wins,
        losses: acc.losses + s.losses,
        ties: acc.ties + s.ties,
        playoffWins: acc.playoffWins + s.playoffWins,
        playoffLosses: acc.playoffLosses + s.playoffLosses,
        championships: acc.championships + s.championships,
        seasonsActive: acc.seasonsActive + s.seasonsActive,
        active: acc.active || s.active,
      }), { wins: 0, losses: 0, ties: 0, playoffWins: 0, playoffLosses: 0, championships: 0, seasonsActive: 0, active: false });
      return { managerId: m.id, name: m.name, ...agg };
    }).filter(Boolean);
  } else {
    rows = DATA.stats.filter(s => s.league === exhibitId).map(s => {
      const m = getManager(s.managerId);
      return {
        managerId: s.managerId, name: m.name,
        wins: s.wins, losses: s.losses, ties: s.ties,
        playoffWins: s.playoffWins, playoffLosses: s.playoffLosses,
        championships: s.championships, seasonsActive: s.seasonsActive, active: s.active,
      };
    });
  }
  if (!includeAlumni) rows = rows.filter(r => r.active);
  rows.forEach(r => {
    const totalGames = r.wins + r.losses + r.ties;
    r.winPct = totalGames ? (r.wins + 0.5 * r.ties) / totalGames : 0;
    const totalPlayoff = r.playoffWins + r.playoffLosses;
    r.playoffWinPct = totalPlayoff ? r.playoffWins / totalPlayoff : 0;
    r.isDualThreat = isDualThreat(r.managerId);
  });
  rows.sort((a, b) => b.winPct - a.winPct);
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}
function getH2H(aId, bId) {
  const entry = DATA.h2h.find(h => (h.a === aId && h.b === bId) || (h.a === bId && h.b === aId));
  if (!entry) return null;
  if (entry.a === aId) return entry;
  return {
    a: aId, b: bId,
    aWins: entry.bWins, bWins: entry.aWins, ties: entry.ties,
    aPlayoffWins: entry.bPlayoffWins, bPlayoffWins: entry.aPlayoffWins,
    aPoints: entry.bPoints, bPoints: entry.aPoints,
  };
}
function getRivals(managerId) {
  let nemesis = null, nemesisLosses = -1, victim = null, victimWins = -1;
  DATA.h2h.forEach(h => {
    let oppId, myWins, myLosses;
    if (h.a === managerId) { oppId = h.b; myWins = h.aWins; myLosses = h.bWins; }
    else if (h.b === managerId) { oppId = h.a; myWins = h.bWins; myLosses = h.aWins; }
    else return;
    if (myLosses > nemesisLosses) { nemesisLosses = myLosses; nemesis = oppId; }
    if (myWins > victimWins) { victimWins = myWins; victim = oppId; }
  });
  return {
    nemesis: nemesis ? getManager(nemesis) : null, nemesisLosses,
    victim: victim ? getManager(victim) : null, victimWins,
  };
}
function pct(n) { return (n * 100).toFixed(1) + '%'; }
function managersForExhibit(exhibitId) {
  if (exhibitId === 'master') {
    // Match the master standings restriction: only managers in 2+ leagues
    const counts = {};
    DATA.stats.forEach(s => { counts[s.managerId] = (counts[s.managerId] || 0) + 1; });
    return DATA.managers.filter(m => (counts[m.id] || 0) >= 2);
  }
  const ids = new Set(DATA.stats.filter(s => s.league === exhibitId).map(s => s.managerId));
  return DATA.managers.filter(m => ids.has(m.id));
}

/* =========================================================
   STANDINGS TABLE
   ========================================================= */
function StandingsTable({ rows, onSelectManager, showPlayoff }) {
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState('desc');

  if (rows.length === 0) {
    return <p className="text-slate-400 text-center py-10 italic">No managers to display for this filter.</p>;
  }

  const columns = [
    { key: 'rank', label: 'Rank', accessor: r => r.rank },
    { key: 'name', label: 'Manager', accessor: r => r.name },
    { key: 'championships', label: 'Trophies', accessor: r => r.championships },
    { key: 'wins', label: 'Record (W-L-T)', accessor: r => r.wins },
    { key: 'winPct', label: 'Win %', accessor: r => r.winPct },
    ...(showPlayoff ? [
      { key: 'playoffWins', label: 'Playoff (W-L)', accessor: r => r.playoffWins },
      { key: 'playoffWinPct', label: 'Playoff Win %', accessor: r => r.playoffWinPct },
    ] : []),
    { key: 'seasonsActive', label: 'Seasons', accessor: r => r.seasonsActive },
  ];

  function handleSort(col) {
    if (sortKey === col.key) {
      setSortDir(d => (d === 'desc' ? 'asc' : 'desc'));
    } else {
      setSortKey(col.key);
      setSortDir(col.key === 'name' ? 'asc' : 'desc');
    }
  }

  const activeCol = columns.find(c => c.key === sortKey);
  const displayRows = activeCol
    ? [...rows].sort((a, b) => {
        const av = activeCol.accessor(a), bv = activeCol.accessor(b);
        let cmp;
        if (typeof av === 'string') cmp = av.localeCompare(bv);
        else cmp = av - bv;
        return sortDir === 'asc' ? cmp : -cmp;
      })
    : rows; // default: original rank order

  return (
    <div className="overflow-x-auto rounded-lg border border-sky-100 shadow-gold-glow bg-white">
      <table className="min-w-full text-sm">
        <thead>
          <tr className="bg-sky-50 text-sky-700 uppercase text-[11px] tracking-wider">
            {columns.map(col => (
              <th
                key={col.key}
                onClick={() => handleSort(col)}
                className="px-4 py-3 text-left font-serif font-normal whitespace-nowrap cursor-pointer select-none hover:text-sky-900 transition"
                title="Click to sort"
              >
                {col.label}
                {sortKey === col.key && <span className="ml-1 text-sky-500">{sortDir === 'asc' ? '▲' : '▼'}</span>}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {displayRows.map(r => (
            <tr key={r.managerId} className="border-t border-slate-100 hover:bg-sky-50/60 transition">
              <td className="px-4 py-3"><RankBadge rank={r.rank} /></td>
              <td className="px-4 py-3">
                <button onClick={() => onSelectManager(r.managerId)} className="font-serif text-slate-800 hover:text-sky-600 hover:underline decoration-sky-400 underline-offset-4 text-left">
                  {r.name}
                </button>
                <div className="flex gap-1 mt-1">
                  {r.rank === 1 && <Badge className="border-amber-300 text-amber-700 bg-amber-50">HOF Inductee</Badge>}
                  {r.isDualThreat && <Badge className="border-fuchsia-300 text-fuchsia-700 bg-fuchsia-50">Dual-Threat</Badge>}
                  {!r.active && <Badge className="border-slate-200 text-slate-400 bg-slate-50">Alumni</Badge>}
                </div>
              </td>
              <td className="px-4 py-3"><TrophyCount count={r.championships} /></td>
              <td className="px-4 py-3 text-slate-600 whitespace-nowrap">{r.wins}-{r.losses}-{r.ties}</td>
              <td className="px-4 py-3 text-sky-700 font-semibold">{pct(r.winPct)}</td>
              {showPlayoff && <td className="px-4 py-3 text-slate-600 whitespace-nowrap">{r.playoffWins}-{r.playoffLosses}</td>}
              {showPlayoff && <td className="px-4 py-3 text-slate-600">{pct(r.playoffWinPct)}</td>}
              <td className="px-4 py-3 text-slate-600">{r.seasonsActive}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function RivalryTool({ managers }) {
  const [aId, setAId] = useState('');
  const [bId, setBId] = useState('');
  const h2h = (aId && bId && aId !== bId) ? getH2H(aId, bId) : null;
  const mA = getManager(aId), mB = getManager(bId);
  const validPair = aId && bId && aId !== bId;

  function careerTotals(managerId) {
    const rows = DATA.stats.filter(s => s.managerId === managerId);
    return rows.reduce((acc, s) => ({
      championships: acc.championships + s.championships,
      wins: acc.wins + s.wins,
      losses: acc.losses + s.losses,
      ties: acc.ties + s.ties,
    }), { championships: 0, wins: 0, losses: 0, ties: 0 });

  function Select({ value, onChange, exclude }) {

      <select

        {managers.filter(m => m.id !== exclude).map(m => (
          <option key={m.id} value={m.id}>{m.name}</option>

  return (
    <div className="mt-10">

        <Select value={bId} onChange={setBId} exclude={aId} />
      </div>

      {(!aId || !bId) && <p className="text-slate-400 italic text-sm">Select two managers to compare their rivalry.</p>}
      {aId && bId && aId === bId && <p className="text-red-500 text-sm">Choose two different managers.</p>}

      {validPair && (
        <div className="mb-8">
          <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-3">Career Comparison — All Sports</p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl">
            {[mA, mB].map((m, i) => {
              const totals = careerTotals(m.id);
              const gp = totals.wins + totals.losses + totals.ties;
              const wp = gp ? (totals.wins + 0.5 * totals.ties) / gp : 0;
              return (
                <div key={i} className="plaque-texture border border-sky-100 rounded-lg p-5 shadow-gold-glow">
                  <h4 className="font-serif text-lg text-slate-800 mb-3">{m.name}</h4>
                  <dl className="space-y-2 text-sm">
                    <div className="flex justify-between"><dt className="text-slate-500">Championships (All Leagues)</dt><dd className="text-sky-700 font-semibold"><TrophyCount count={totals.championships} /></dd></div>
                    <div className="flex justify-between"><dt className="text-slate-500">Career Record (All Leagues)</dt><dd className="text-sky-700 font-semibold">{totals.wins}-{totals.losses}-{totals.ties}</dd></div>
                    <div className="flex justify-between"><dt className="text-slate-500">Career Win %</dt><dd className="text-sky-700 font-semibold">{pct(wp)}</dd></div>
                  </dl>
                </div>
              );
            })}
          </div>
          <p className="text-slate-400 text-xs mt-3 italic">Combines every league each manager plays in, including baseball — which has no game-by-game head-to-head log, so it's reflected here as career totals rather than direct matchups.</p>
        </div>
      )}

      {h2h && (
        <div>
          <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-3">Direct Head-to-Head — Football</p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl">
            {[
              { m: mA, wins: h2h.aWins, losses: h2h.bWins, pw: h2h.aPlayoffWins, pl: h2h.bPlayoffWins, pts: h2h.aPoints },
              { m: mB, wins: h2h.bWins, losses: h2h.aWins, pw: h2h.bPlayoffWins, pl: h2h.aPlayoffWins, pts: h2h.bPoints },
            ].map((side, i) => {
              const total = side.wins + side.losses;

                <div key={i} className="plaque-texture border border-sky-100 rounded-lg p-5 shadow-gold-glow">
                  <h4 className="font-serif text-lg text-slate-800 mb-3">{side.m.name}</h4>

/* =========================================================
   LEAGUE TIMELINE
   ========================================================= */
function LeagueTimeline({ exhibitId }) {
  const entries = (DATA.history && DATA.history[exhibitId]) || [];
  if (entries.length === 0) return null;

  // walk oldest -> newest, tracking each champion's title count so far
  const titleCounts = {};
  const withMeta = entries.map(e => {
    titleCounts[e.championId] = (titleCounts[e.championId] || 0) + 1;
    const n = titleCounts[e.championId];
    let flavor = null;
    if (n === 1) flavor = 'First Title';
    else if (n === 2) flavor = 'Back-to-Back?';
    else flavor = `${n}${n === 3 ? 'rd' : 'th'} Title`;
    return { ...e, titleNumber: n, flavor };
  });

  // detect true back-to-back (same champion as immediately preceding season)
  withMeta.forEach((e, i) => {
    if (i > 0 && withMeta[i - 1].championId === e.championId) {
      e.flavor = 'Back-to-Back Champion';
    } else if (e.titleNumber === 2) {
      e.flavor = '2nd Title';
    }
  });

  return (
    <div className="mt-12">
      <h3 className="font-serif text-xl text-slate-800 mb-1 flex items-center gap-2">🏛️ League Timeline</h3>
      <p className="text-slate-400 text-sm mb-6">Every champion in league history, walked season by season.</p>
      <div className="relative pl-8">
        <div className="absolute left-[11px] top-2 bottom-2 w-0.5 bg-sky-100" />
        <div className="space-y-6">
          {withMeta.slice().reverse().map(e => {
            const champ = getManager(e.championId);
            const runner = e.runnerUpId ? getManager(e.runnerUpId) : null;
            return (
              <div key={e.year} className="relative">
                <div className="absolute -left-8 top-1 w-6 h-6 rounded-full bg-white border-2 border-amber-400 flex items-center justify-center text-xs">
                  🏆
                </div>
                <div className="plaque-texture border border-sky-100 rounded-lg p-4 shadow-gold-glow">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <span className="font-serif text-lg text-slate-800">{e.year}</span>
                    {e.flavor && (
                      <Badge className="border-amber-300 text-amber-700 bg-amber-50">{e.flavor}</Badge>
                    )}
                  </div>
                  <p className="mt-2 text-slate-700">
                    <span className="text-amber-600 font-semibold">👑 {champ ? champ.name : 'Unknown'}</span>
                  </p>
                  {runner && (
                    <p className="text-slate-400 text-sm mt-1">Runner-up: {runner.name}</p>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

                            : <Badge className="border-slate-200 text-slate-400 bg-slate-50">Alumni</Badge>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
          <div className="bg-sky-50 border border-sky-100 rounded-md p-4">
            <p className="text-slate-400 text-[11px] uppercase tracking-wide mb-1">Best Single Season</p>
            <p className="font-serif text-sky-700 text-lg">{m.bestSeason.record}</p>
            <p className="text-slate-500 text-xs mt-1">{m.bestSeason.year} · {DATA.leagues.find(l => l.id === m.bestSeason.league).name}</p>
          </div>
          <div className="bg-sky-50 border border-sky-100 rounded-md p-4">
            <p className="text-slate-400 text-[11px] uppercase tracking-wide mb-1">Career Championships</p>
            <p className="font-serif text-sky-700 text-lg"><TrophyCount count={totalChampionships} /></p>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div className="bg-red-50 border border-red-200 rounded-md p-4">
            <p className="text-red-500 text-[11px] uppercase tracking-wide mb-1">😈 Nemesis</p>
            {nemesis ? (
              <React.Fragment>
                <p className="font-serif text-red-700 text-lg">{nemesis.name}</p>
                <p className="text-red-500/70 text-xs mt-1">{nemesisLosses} career losses suffered</p>
              </React.Fragment>
            ) : <p className="text-slate-400 text-sm italic">No rivals recorded</p>}
          </div>
          <div className="bg-emerald-50 border border-emerald-200 rounded-md p-4">
            <p className="text-emerald-600 text-[11px] uppercase tracking-wide mb-1">🎯 Victim</p>
            {victim ? (
              <React.Fragment>
                <p className="font-serif text-emerald-700 text-lg">{victim.name}</p>
                <p className="text-emerald-600/70 text-xs mt-1">{victimWins} career wins earned</p>
              </React.Fragment>
            ) : <p className="text-slate-400 text-sm italic">No rivals recorded</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   RECORDS & SUPERLATIVES
   ========================================================= */
function RecordCard({ icon, title, children }) {
  return (
    <div className="plaque-texture border border-sky-100 rounded-lg p-4 shadow-gold-glow">
      <p className="text-slate-400 text-[11px] uppercase tracking-wide mb-2 flex items-center gap-1.5">
        <span>{icon}</span>{title}
      </p>
      {children}
    </div>
  );
}
function weekLabel(year, week) {
  return `${year}, Week ${week}`;
}
function RecordsAndSuperlatives({ exhibitId }) {
  const r = (DATA.records && DATA.records[exhibitId]) || {};
  const hasAny = Object.keys(r).length > 0;
  if (!hasAny) return null;
  const nm = id => (getManager(id) ? getManager(id).name : 'Unknown');

  return (
    <div className="mt-10">
      <h3 className="font-serif text-xl text-slate-800 mb-1 flex items-center gap-2">📊 Records &amp; Superlatives</h3>
      <p className="text-slate-400 text-sm mb-6">The extremes of league history — best, worst, hottest, coldest.</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {r.highestScore && (
          <RecordCard icon="🚀" title="Highest Score Ever">
            <p className="font-serif text-2xl text-sky-700">{r.highestScore.score}</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.highestScore.manager)} <span className="text-slate-400">vs</span> {nm(r.highestScore.opponent)}</p>
            <p className="text-slate-400 text-xs mt-1">{weekLabel(r.highestScore.year, r.highestScore.week)}</p>
          </RecordCard>
        )}
        {r.lowestScore && (
          <RecordCard icon="🥶" title="Lowest Score Ever">
            <p className="font-serif text-2xl text-sky-700">{r.lowestScore.score}</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.lowestScore.manager)} <span className="text-slate-400">vs</span> {nm(r.lowestScore.opponent)}</p>
            <p className="text-slate-400 text-xs mt-1">{weekLabel(r.lowestScore.year, r.lowestScore.week)}</p>
          </RecordCard>
        )}
        {r.biggestBlowout && (
          <RecordCard icon="💥" title="Biggest Blowout">
            <p className="font-serif text-2xl text-sky-700">+{r.biggestBlowout.margin}</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.biggestBlowout.winner)} {r.biggestBlowout.winnerScore} <span className="text-slate-400">def.</span> {nm(r.biggestBlowout.loser)} {r.biggestBlowout.loserScore}</p>
            <p className="text-slate-400 text-xs mt-1">{weekLabel(r.biggestBlowout.year, r.biggestBlowout.week)}</p>
          </RecordCard>
        )}
        {r.closestGame && (
          <RecordCard icon="😅" title="Closest Game Ever">
            <p className="font-serif text-2xl text-sky-700">{r.closestGame.margin}</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.closestGame.winner)} {r.closestGame.winnerScore} <span className="text-slate-400">def.</span> {nm(r.closestGame.loser)} {r.closestGame.loserScore}</p>
            <p className="text-slate-400 text-xs mt-1">{weekLabel(r.closestGame.year, r.closestGame.week)}</p>
          </RecordCard>
        )}
        {r.longestWinStreak && r.longestWinStreak.manager && (
          <RecordCard icon="🔥" title="Longest Win Streak">
            <p className="font-serif text-2xl text-sky-700">{r.longestWinStreak.length} games</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.longestWinStreak.manager)}</p>
            {r.longestWinStreak.range && (
              <p className="text-slate-400 text-xs mt-1">{weekLabel(...r.longestWinStreak.range[0])} – {weekLabel(...r.longestWinStreak.range[1])}</p>
            )}
          </RecordCard>
        )}
        {r.longestLossStreak && r.longestLossStreak.manager && (
          <RecordCard icon="🧊" title="Longest Losing Streak">
            <p className="font-serif text-2xl text-sky-700">{r.longestLossStreak.length} games</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.longestLossStreak.manager)}</p>
            {r.longestLossStreak.range && (
              <p className="text-slate-400 text-xs mt-1">{weekLabel(...r.longestLossStreak.range[0])} – {weekLabel(...r.longestLossStreak.range[1])}</p>
            )}
          </RecordCard>
        )}
        {r.hottestCurrentStreak && (
          <RecordCard icon="🌡️" title="Hottest Right Now">
            <p className="font-serif text-2xl text-sky-700">{r.hottestCurrentStreak.length}-game win streak</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.hottestCurrentStreak.manager)}</p>
            <p className="text-slate-400 text-xs mt-1">Through {weekLabel(r.hottestCurrentStreak.lastYear, r.hottestCurrentStreak.lastWeek)}</p>
          </RecordCard>
        )}
        {r.coldestCurrentStreak && (
          <RecordCard icon="❄️" title="Coldest Right Now">
            <p className="font-serif text-2xl text-sky-700">{r.coldestCurrentStreak.length}-game slide</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.coldestCurrentStreak.manager)}</p>
            <p className="text-slate-400 text-xs mt-1">Through {weekLabel(r.coldestCurrentStreak.lastYear, r.coldestCurrentStreak.lastWeek)}</p>
          </RecordCard>
        )}
        {r.bestNeverWon && (
          <RecordCard icon="💎" title="Best Team Never to Win It">
            <p className="font-serif text-2xl text-sky-700">{pct(r.bestNeverWon.winPct)}</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.bestNeverWon.manager)}</p>
            <p className="text-slate-400 text-xs mt-1">{r.bestNeverWon.wins}-{r.bestNeverWon.losses}-{r.bestNeverWon.ties}, still no title</p>
          </RecordCard>
        )}
        {r.longestDrought && (
          <RecordCard icon="👻" title="Longest Championship Drought">
            <p className="font-serif text-2xl text-sky-700">{r.longestDrought.drought} {r.longestDrought.drought === 1 ? 'season' : 'seasons'}</p>
            <p className="text-slate-600 text-sm mt-1">{nm(r.longestDrought.manager)}</p>
            <p className="text-slate-400 text-xs mt-1">{r.longestDrought.everWon ? 'Since their last title' : 'Still searching for a first title'}</p>
          </RecordCard>
        )}
      </div>
    </div>
  );
}

/* =========================================================
   EXHIBIT VIEW
   ========================================================= */
function ExhibitView({ exhibit, includeAlumni, setIncludeAlumni, onSelectManager }) {
  const rows = useMemo(() => computeStandings(exhibit.id, includeAlumni), [exhibit.id, includeAlumni]);
  const managers = managersForExhibit(exhibit.id);
  const isMaster = exhibit.id === 'master';
  // Playoff bracket detail only exists for Horner and Zero Prep (and the master
  // rollup, since it sums whatever real playoff data exists across leagues).
  // Jon Bought Dinner and Baseball have no reliable playoff W-L in the source data.
  const showPlayoff = exhibit.id === 'work' || exhibit.id === 'football3' || isMaster;

  return (
    <div className="max-w-6xl mx-auto px-4 py-10">
      <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8">
        <div>
          <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-1">{isMaster ? 'Master Exhibit' : exhibit.sport + ' League'}</p>
          <h2 className="font-serif text-3xl text-slate-800">{exhibit.name}</h2>
        </div>
        <label className="flex items-center gap-3 bg-white border border-sky-200 rounded-full px-4 py-2 select-none cursor-pointer shadow-sm">
          <span className={"text-xs " + (!includeAlumni ? "text-sky-700 font-semibold" : "text-slate-400")}>Active Members</span>
          <span
            onClick={() => setIncludeAlumni(!includeAlumni)}
            className={"relative inline-flex h-5 w-9 items-center rounded-full transition " + (includeAlumni ? "bg-sky-500" : "bg-slate-200")}
          >
            <span className={"inline-block h-4 w-4 transform rounded-full bg-white shadow transition " + (includeAlumni ? "translate-x-5" : "translate-x-1")} />
          </span>
          <span className={"text-xs " + (includeAlumni ? "text-sky-700 font-semibold" : "text-slate-400")}>All-Time (Alumni)</span>
        </label>
      </div>

      {DATA.notes && DATA.notes[exhibit.id] && (
        <p className="text-slate-400 text-xs italic mb-4 bg-sky-50 border border-sky-100 rounded-md px-3 py-2">
          ℹ️ {DATA.notes[exhibit.id]}
        </p>
      )}

      <StandingsTable rows={rows} onSelectManager={onSelectManager} showPlayoff={showPlayoff} />
      {!isMaster && <RecordsAndSuperlatives exhibitId={exhibit.id} />}
      <RivalryTool managers={managers} />
      {!isMaster && <TradeBlock exhibitId={exhibit.id} />}
      {!isMaster && <LeagueTimeline exhibitId={exhibit.id} />}
    </div>
  );
}

/* =========================================================
   HEADER / TABS
   ========================================================= */
function Header({ unlocked, currentId, onSwitch, onLock, onGoLobby }) {
  const tabs = ALL_EXHIBITS.filter(ex => unlocked.includes(ex.id));
  return (
    <div className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-sky-100 shadow-sm">
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <button onClick={onGoLobby} className="font-serif text-slate-800 text-sm tracking-wide flex items-center gap-2 hover:text-sky-600">
          🏛️ <span className="hidden sm:inline">Hall of Fame</span>
        </button>
        <div className="flex items-center gap-1 overflow-x-auto">
          {tabs.map(ex => (
            <button
              key={ex.id}
              onClick={() => onSwitch(ex.id)}
              className={
                "px-3 py-1.5 rounded-md text-xs font-serif tracking-wide whitespace-nowrap transition border " +
                (currentId === ex.id
                  ? "bg-sky-50 border-sky-300 text-sky-700"
                  : "border-transparent text-slate-400 hover:text-sky-600 hover:border-sky-200")
              }
            >
              {ex.id === 'master' ? '👑 ' : ''}{ex.name}
            </button>
          ))}
        </div>
        <button
          onClick={onLock}
          className="text-xs border border-sky-200 text-slate-500 hover:text-slate-800 hover:border-sky-400 rounded-md px-3 py-1.5 whitespace-nowrap"
        >
          🔒 Lock / Change Vault
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [unlocked, setUnlocked] = useState(loadUnlocked());
  const [view, setView] = useState(() => {
    const u = loadUnlocked();
    if (u.length === 0) return null;
    return u.includes('master') ? 'master' : u[0];
  });
  const [pinTarget, setPinTarget] = useState(null);
  const [includeAlumni, setIncludeAlumni] = useState(false);
  const [selectedManager, setSelectedManager] = useState(null);

  function handleUnlockSuccess(exhibit) {
    let next;
    if (exhibit.id === 'master') {
      next = Array.from(new Set([...unlocked, ...ALL_EXHIBITS.map(e => e.id)]));
    } else {
      next = Array.from(new Set([...unlocked, exhibit.id]));
    }
    setUnlocked(next);
    saveUnlocked(next);
    setView(exhibit.id);
    setPinTarget(null);
  }

  function handleSelectExhibit(exhibit) {
    if (unlocked.includes(exhibit.id)) {
      setView(exhibit.id);
    } else {
      setPinTarget(exhibit);
    }
  }

  function handleLock() {
    localStorage.removeItem(STORAGE_KEY);
    setUnlocked([]);
    setView(null);
  }

  const currentExhibit = ALL_EXHIBITS.find(e => e.id === view) || null;

  return (
    <div className="min-h-screen">
      {unlocked.length > 0 && (
        <Header
          unlocked={unlocked}
          currentId={view}
          onSwitch={setView}
          onLock={handleLock}
          onGoLobby={() => setView(null)}
        />
      )}

      {(!view || !currentExhibit) ? (
        <Lobby unlocked={unlocked} onSelect={handleSelectExhibit} />
      ) : (
        <ExhibitView
          exhibit={currentExhibit}
          includeAlumni={includeAlumni}
          setIncludeAlumni={setIncludeAlumni}
          onSelectManager={setSelectedManager}
        />
      )}

      {pinTarget && (
        <PinModal
          exhibit={pinTarget}
          onClose={() => setPinTarget(null)}
          onSuccess={handleUnlockSuccess}
        />
      )}

      {selectedManager && (
        <ManagerPlaqueModal
          managerId={selectedManager}
          onClose={() => setSelectedManager(null)}
        />
      )}

      <footer className="text-center text-slate-300 text-xs py-10">
        Fantasy Sports Hall of Fame & Museum — Est. this season · All records are self-contained, no server required.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
