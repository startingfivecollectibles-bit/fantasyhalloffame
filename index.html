  const SIMS = 6000;
  const last = {}, champ = {};
  teams.forEach(t => { last[t.id] = 0; champ[t.id] = 0; });
  for (let s = 0; s < SIMS; s++) {
    let lastId = null, lastScore = Infinity, champId = null, champScore = -Infinity;
    teams.forEach(t => {
      const fin = t.w + bin(Math.max(0, N - t.g), t.p) + t.pf * 1e-7 + rng() * 1e-3;
      if (fin < lastScore) { lastScore = fin; lastId = t.id; }
      if (fin > champScore) { champScore = fin; champId = t.id; }
    });
    last[lastId]++; champ[champId]++;
  }
  const out = {};
  teams.forEach(t => { out[t.id] = { last: last[t.id] / SIMS, champ: champ[t.id] / SIMS, mu: t.w + Math.max(0, N - t.g) * t.p }; });
  return out;
}
function dinnerMatchup(entries, N, seedGames, aId, bId) {
  const base = simDinner(entries, N, seedGames, null);
  const aWin = simDinner(entries, N, seedGames, { win: aId, lose: bId });
  const bWin = simDinner(entries, N, seedGames, { win: bId, lose: aId });
  const side = (me, W, L) => ({ lastNow: base[me].last, lastWin: W[me].last, lastLose: L[me].last, champNow: base[me].champ, champWin: W[me].champ, champLose: L[me].champ });
  return { a: side(aId, aWin, bWin), b: side(bId, bWin, aWin) };
}

/* =========================================================
   STANDINGS / H2H
   ========================================================= */
function computeStandings(exhibitId, includeAlumni, sortMode, stats) {
  stats = stats || DATA.stats;
  sortMode = sortMode || 'hof';
  let rows;
  if (exhibitId === 'master') {
    rows = DATA.managers.map(m => {
      const statRows = stats.filter(s => s.managerId === m.id);
      if (statRows.length < 2) return null; // Master exhibit: only multi-league managers
      const agg = statRows.reduce((acc, s) => ({
        wins: acc.wins + s.wins,
        losses: acc.losses + s.losses,
        ties: acc.ties + s.ties,
        playoffWins: acc.playoffWins + s.playoffWins,
        playoffLosses: acc.playoffLosses + s.playoffLosses,
        playoffAppearances: acc.playoffAppearances + (s.playoffAppearances || 0),
        championships: acc.championships + s.championships,
        seasonsActive: acc.seasonsActive + s.seasonsActive,
        active: acc.active || s.active,
      }), { wins: 0, losses: 0, ties: 0, playoffWins: 0, playoffLosses: 0, playoffAppearances: 0, championships: 0, seasonsActive: 0, active: false });
      return { managerId: m.id, name: m.name, ...agg };
    }).filter(Boolean);
  } else {
    rows = stats.filter(s => s.league === exhibitId).map(s => {
      const m = getManager(s.managerId);
      return {
        managerId: s.managerId, name: m ? m.name : s.managerId,
        wins: s.wins, losses: s.losses, ties: s.ties,
        playoffWins: s.playoffWins, playoffLosses: s.playoffLosses,
        playoffAppearances: s.playoffAppearances || 0,
        championships: s.championships, seasonsActive: s.seasonsActive, active: s.active,
      };
    });
  }
  if (!includeAlumni) rows = rows.filter(r => r.active);
  rows.forEach(r => {
    const totalGames = r.wins + r.losses + r.ties;
    r.winPct = totalGames ? (r.wins + 0.5 * r.ties) / totalGames : 0;
    const totalPlayoff = r.playoffWins + r.playoffLosses;
    r.playoffWinPct = totalPlayoff ? r.playoffWins / totalPlayoff : 0;
    r.isDualThreat = isDualThreat(r.managerId);
  });

  // Per-Season HOF Score:
  //   Title Rate    = (Championships / Tracked Seasons) * 100
  //   Playoff Rate  = (Playoff Appearances / Tracked Seasons) * 25
  //   Win Rate      = Overall Win % * 50
  //   Longevity     = Tracked Seasons * 5
  rows = rows.filter(r => r.seasonsActive >= 2); // minimum qualification: 2 tracked seasons
  rows.forEach(r => {
    const titleRate = (r.championships / r.seasonsActive) * 100;
    const playoffRate = (r.playoffAppearances / r.seasonsActive) * 25;
    const winRate = r.winPct * 50;
    const longevityBonus = r.seasonsActive * 5;
    r.hofScore = titleRate + playoffRate + winRate + longevityBonus;
    r.titleRate = titleRate;
    r.playoffRate = playoffRate;
    r.winRate = winRate;
    r.longevityBonus = longevityBonus;
  });
  const sorters = {
    hof: (a, b) => b.hofScore - a.hofScore,
    rings: (a, b) => b.championships - a.championships || b.hofScore - a.hofScore,
    winpct: (a, b) => b.winPct - a.winPct || b.hofScore - a.hofScore,
  };
  rows.sort(sorters[sortMode] || sorters.hof);
  if (exhibitId === 'master') {
    rows = rows.slice(0, 10); // Master only: cap to top 10
  }
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}
function getH2H(aId, bId, h2hArr) {
  const arr = h2hArr || DATA.h2h;
  const entry = arr.find(h => (h.a === aId && h.b === bId) || (h.a === bId && h.b === aId));
  if (!entry) return null;
  if (entry.a === aId) return entry;
  return {
    a: aId, b: bId,
    aWins: entry.bWins, bWins: entry.aWins, ties: entry.ties,
    aPlayoffWins: entry.bPlayoffWins, bPlayoffWins: entry.aPlayoffWins,
    aPoints: entry.bPoints, bPoints: entry.aPoints,
  };
}
function getRivals(managerId, h2hArr) {
  const arr = h2hArr || DATA.h2h;
  let nemesis = null, nemesisLosses = -1, victim = null, victimWins = -1;
  arr.forEach(h => {
    let oppId, myWins, myLosses;
    if (h.a === managerId) { oppId = h.b; myWins = h.aWins; myLosses = h.bWins; }
    else if (h.b === managerId) { oppId = h.a; myWins = h.bWins; myLosses = h.aWins; }
    else return;
    if (myLosses > nemesisLosses) { nemesisLosses = myLosses; nemesis = oppId; }
    if (myWins > victimWins) { victimWins = myWins; victim = oppId; }
  });
  return {
    nemesis: nemesis ? getManager(nemesis) : null, nemesisLosses,
    victim: victim ? getManager(victim) : null, victimWins,
  };
}
function managersForExhibit(exhibitId) {
  if (exhibitId === 'master') {
    const counts = {};
    DATA.stats.forEach(s => { counts[s.managerId] = (counts[s.managerId] || 0) + 1; });
    return DATA.managers.filter(m => (counts[m.id] || 0) >= 2);
  }
  const ids = new Set(DATA.stats.filter(s => s.league === exhibitId).map(s => s.managerId));
  return DATA.managers.filter(m => ids.has(m.id));
}

function StandingsTable({ rows, onSelectManager, showPlayoff, showHofScore, hofMode }) {
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState('desc');

  if (rows.length === 0) {
    return <p className="text-slate-400 text-center py-10 italic">No managers to display for this filter.</p>;
  }

  const columns = [
    { key: 'rank', label: 'Rank', accessor: r => r.rank },
    { key: 'name', label: 'Manager', accessor: r => r.name },
    ...(showHofScore ? [{ key: 'hofScore', label: 'HOF Score', accessor: r => r.hofScore }] : []),
    { key: 'championships', label: 'Trophies', accessor: r => r.championships },
    { key: 'wins', label: 'Record (W-L-T)', accessor: r => r.wins },
    { key: 'winPct', label: 'Win %', accessor: r => r.winPct },
    ...(showPlayoff ? [
      { key: 'playoffWins', label: 'Playoff (W-L)', accessor: r => r.playoffWins },
      { key: 'playoffWinPct', label: 'Playoff Win %', accessor: r => r.playoffWinPct },
    ] : []),
    { key: 'seasonsActive', label: 'Seasons', accessor: r => r.seasonsActive },
  ];

  function handleSort(col) {
    if (sortKey === col.key) {
      setSortDir(d => (d === 'desc' ? 'asc' : 'desc'));
    } else {
      setSortKey(col.key);
      setSortDir(col.key === 'name' ? 'asc' : 'desc');
    }
  }

  const activeCol = columns.find(c => c.key === sortKey);
  const displayRows = activeCol
    ? [...rows].sort((a, b) => {
        const av = activeCol.accessor(a), bv = activeCol.accessor(b);
        let cmp;
        if (typeof av === 'string') cmp = av.localeCompare(bv);
        else cmp = av - bv;
        return sortDir === 'asc' ? cmp : -cmp;
      })
    : rows;

  return (
    <div className="overflow-x-auto rounded-lg border border-sky-100 shadow-gold-glow bg-white">
      <table className="min-w-full text-sm">
        <thead>
          <tr className="bg-sky-50 text-sky-700 uppercase text-[11px] tracking-wider">

              <th
                key={col.key}
                onClick={() => handleSort(col)}
                className="px-4 py-3 text-left font-serif font-normal whitespace-nowrap cursor-pointer select-none hover:text-sky-900 transition"
                title={col.key === 'hofScore' ? 'Title Rate + Playoff Rate + Win Rate + Longevity Bonus' : 'Click to sort'}
              >
                {col.label}
                {sortKey === col.key && <span className="ml-1 text-sky-500">{sortDir === 'asc' ? '▲' : '▼'}</span>}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {displayRows.map(r => (
            <tr key={r.managerId} className="border-t border-slate-100 hover:bg-sky-50/60 transition">
              <td className="px-4 py-3"><RankBadge rank={r.rank} /></td>
              <td className="px-4 py-3">
                <button onClick={() => onSelectManager(r.managerId)} className="font-serif text-slate-800 hover:text-sky-600 hover:underline decoration-sky-400 underline-offset-4 text-left">
                  {r.name}
                </button>
                <div className="flex gap-1 mt-1">
                  {r.rank === 1 && hofMode && <Badge className="border-amber-300 text-amber-700 bg-amber-50">HOF Inductee</Badge>}
                  {r.isDualThreat && <Badge className="border-fuchsia-300 text-fuchsia-700 bg-fuchsia-50">Dual-Threat</Badge>}
                  {!r.active && <Badge className="border-slate-200 text-slate-400 bg-slate-50">Alumni</Badge>}
                </div>
              </td>

/* =========================================================
   RIVALRY TOOL
   ========================================================= */
function RivalryTool({ managers, eff }) {
  const [aId, setAId] = useState('');
  const [bId, setBId] = useState('');
  const h2h = (aId && bId && aId !== bId) ? getH2H(aId, bId, eff.h2h) : null;
  const mA = getManager(aId), mB = getManager(bId);
  const validPair = aId && bId && aId !== bId;

  function careerTotals(managerId) {
    const rows = eff.stats.filter(s => s.managerId === managerId);
    return rows.reduce((acc, s) => ({
      championships: acc.championships + s.championships,
      wins: acc.wins + s.wins,
      losses: acc.losses + s.losses,
      ties: acc.ties + s.ties,
    }), { championships: 0, wins: 0, losses: 0, ties: 0 });
  }

  function Select({ value, onChange, exclude }) {
    return (
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        className="w-full bg-white border border-sky-200 rounded-md px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400"
      >
        <option value="">Select manager…</option>
        {managers.filter(m => m.id !== exclude).map(m => (
          <option key={m.id} value={m.id}>{m.name}</option>
        ))}
      </select>
    );
  }

  return (
    <div className="mt-10">
      <h3 className="font-serif text-xl text-slate-800 mb-4 flex items-center gap-2">⚔️ Head-to-Head Rivalry Comparison</h3>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 max-w-xl">
        <Select value={aId} onChange={setAId} exclude={bId} />
        <Select value={bId} onChange={setBId} exclude={aId} />
      </div>

      {(!aId || !bId) && <p className="text-slate-400 italic text-sm">Select two managers to compare their rivalry.</p>}
      {aId && bId && aId === bId && <p className="text-red-500 text-sm">Choose two different managers.</p>}

      {validPair && (
        <div className="mb-8">
          <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-3">Career Comparison — All Sports</p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl">
            {[mA, mB].map((m, i) => {
              const totals = careerTotals(m.id);
              const gp = totals.wins + totals.losses + totals.ties;
              const wp = gp ? (totals.wins + 0.5 * totals.ties) / gp : 0;
              return (
                <div key={i} className="plaque-texture border border-sky-100 rounded-lg p-5 shadow-gold-glow">
                  <h4 className="font-serif text-lg text-slate-800 mb-3">{m.name}</h4>
                  <dl className="space-y-2 text-sm">
                    <div className="flex justify-between"><dt className="text-slate-500">Championships (All Leagues)</dt><dd className="text-sky-700 font-semibold"><TrophyCount count={totals.championships} /></dd></div>
                    <div className="flex justify-between"><dt className="text-slate-500">Career Record (All Leagues)</dt><dd className="text-sky-700 font-semibold">{totals.wins}-{totals.losses}-{totals.ties}</dd></div>
                    <div className="flex justify-between"><dt className="text-slate-500">Career Win %</dt><dd className="text-sky-700 font-semibold">{pct(wp)}</dd></div>
                  </dl>
                </div>
              );
            })}
          </div>
          <p className="text-slate-400 text-xs mt-3 italic">Combines every league each manager plays in, including baseball — which has no game-by-game head-to-head log, so it's reflected here as career totals rather than direct matchups.</p>
        </div>
      )}

      {h2h && (
        <div>
          <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-3">Direct Head-to-Head — Football</p>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl">
            {[
              { m: mA, wins: h2h.aWins, losses: h2h.bWins, pw: h2h.aPlayoffWins, pl: h2h.bPlayoffWins, pts: h2h.aPoints },
              { m: mB, wins: h2h.bWins, losses: h2h.aWins, pw: h2h.bPlayoffWins, pl: h2h.aPlayoffWins, pts: h2h.bPoints },
            ].map((side, i) => {
              const total = side.wins + side.losses;
              const winPct = total ? side.wins / total : 0;
              return (
                <div key={i} className="plaque-texture border border-sky-100 rounded-lg p-5 shadow-gold-glow">
                  <h4 className="font-serif text-lg text-slate-800 mb-3">{side.m.name}</h4>
                  <dl className="space-y-2 text-sm">
                    <div className="flex justify-between"><dt className="text-slate-500">Overall H2H Record</dt><dd className="text-sky-700 font-semibold">{side.wins}-{side.losses}</dd></div>
                    <div className="flex justify-between"><dt className="text-slate-500">H2H Win %</dt><dd className="text-sky-700 font-semibold">{pct(winPct)}</dd></div>
                    <div className="flex justify-between"><dt className="text-slate-500">Playoff H2H</dt><dd className="text-sky-700 font-semibold">{side.pw}-{side.pl}</dd></div>
                    <div className="flex justify-between"><dt className="text-slate-500">Total Points Scored</dt><dd className="text-sky-700 font-semibold">{side.pts.toLocaleString()}</dd></div>
                  </dl>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {aId && bId && aId !== bId && !h2h && (
        <p className="text-slate-400 italic text-sm">These managers have never faced each other in a football matchup.</p>
      )}
    </div>
  );
}

/* =========================================================
   LEAGUE TIMELINE
   ========================================================= */
function LeagueTimeline({ exhibitId }) {
  const entries = (DATA.history && DATA.history[exhibitId]) || [];
  if (entries.length === 0) return null;

  const titleCounts = {};
  const withMeta = entries.map(e => {
    titleCounts[e.championId] = (titleCounts[e.championId] || 0) + 1;
    const n = titleCounts[e.championId];
    let flavor = null;
    if (n === 1) flavor = 'First Title';
    else if (n === 2) flavor = 'Back-to-Back?';
    else flavor = `${n}${n === 3 ? 'rd' : 'th'} Title`;
    return { ...e, titleNumber: n, flavor };
  });

  withMeta.forEach((e, i) => {
    if (i > 0 && withMeta[i - 1].championId === e.championId) {
      e.flavor = 'Back-to-Back Champion';
    } else if (e.titleNumber === 2) {
      e.flavor = '2nd Title';
    }
  });

  return (
    <div className="mt-12">
      <h3 className="font-serif text-xl text-slate-800 mb-1 flex items-center gap-2">🏛️ League Timeline</h3>
      <p className="text-slate-400 text-sm mb-6">Every champion in league history, walked season by season.</p>
      <div className="relative pl-8">
        <div className="absolute left-[11px] top-2 bottom-2 w-0.5 bg-sky-100" />
        <div className="space-y-6">
          {withMeta.slice().reverse().map(e => {
            const champ = getManager(e.championId);
            const runner = e.runnerUpId ? getManager(e.runnerUpId) : null;
            return (
              <div key={e.year} className="relative">
                <div className="absolute -left-8 top-1 w-6 h-6 rounded-full bg-white border-2 border-amber-400 flex items-center justify-center text-xs">
                  🏆
                </div>
                <div className="plaque-texture border border-sky-100 rounded-lg p-4 shadow-gold-glow">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <span className="font-serif text-lg text-slate-800">{e.year}</span>
                    {e.flavor && (
                      <Badge className="border-amber-300 text-amber-700 bg-amber-50">{e.flavor}</Badge>
                    )}
                  </div>
                  <p className="mt-2 text-slate-700">
                    <span className="text-amber-600 font-semibold">👑 {champ ? champ.name : 'Unknown'}</span>
                  </p>
                  {runner && (
                    <p className="text-slate-400 text-sm mt-1">Runner-up: {runner.name}</p>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function activeManagerIds(leagueId, games) {
  const ids = new Set(DATA.stats.filter(s => s.league === leagueId && s.active).map(s => s.managerId));
  games.filter(g => g.league === leagueId).forEach(g => { ids.add(g.a); ids.add(g.b); });
  return Array.from(ids).filter(id => getManager(id)).sort((a, b) => mgrName(a).localeCompare(mgrName(b)));
}
function lastMeetingText(games, leagueId, a, b) {
  const meets = games.filter(g => g.league === leagueId && ((g.a === a && g.b === b) || (g.a === b && g.b === a))).sort((x, y) => y.week - x.week);
  if (!meets.length) return `No ${SEASON_YEAR} meeting yet — see all-time series.`;
  const g = meets[0];
  const aScore = g.a === a ? g.aScore : g.bScore, bScore = g.a === a ? g.bScore : g.aScore;
  if (aScore === bScore) return `${SEASON_YEAR} Week ${g.week}: tied ${num2(aScore)}–${num2(bScore)}`;
  const winner = aScore > bScore ? a : b;
  return `${SEASON_YEAR} Week ${g.week}: ${mgrName(winner)} won ${num2(Math.max(aScore, bScore))}–${num2(Math.min(aScore, bScore))}`;
}
function milestonesFor(leagueId, eff, games) {
  const out = [];
  const step = leagueSport(leagueId) === 'Baseball' ? 100 : 50;
  eff.stats.filter(s => s.league === leagueId && s.active).forEach(s => {
    const next = (Math.floor(s.wins / step) + 1) * step;
    const away = next - s.wins;
    if (away <= 5) out.push(`${mgrName(s.managerId)} is ${away} win${away === 1 ? '' : 's'} from ${next} career league wins (currently ${s.wins}).`);
  });
  const table = seasonTable(games, leagueId);
  table.forEach(r => {
    if (r.streakLen >= 3) out.push(`${r.name} is on a ${r.streakLen}-game ${r.streakType === 'W' ? 'winning' : r.streakType === 'L' ? 'losing' : 'tie'} streak.`);
  });
  return out;
}

  useEffect(() => { setRegGames(gamesFor(leagueId)); }, [leagueId]);

  const ids = useMemo(() => activeManagerIds(leagueId, live.parsed.games), [leagueId, live.parsed.games]);
  const slotCount = Math.max(1, Math.floor(ids.length / 2));
  const storeKey = `hof_newsletter_${leagueId}_${week}`;

  // load saved matchups when league/week changes
  useEffect(() => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(storeKey) || 'null'); } catch (e) {}
    const base = Array.from({ length: slotCount }, (_, i) => (saved && saved[i]) || { a: '', b: '' });
    setMatchups(base);
  }, [storeKey, slotCount]);

  // jump to next unplayed week when the sheet loads or league changes
  useEffect(() => { setWeek(maxWeek + 1); }, [leagueId, maxWeek]);

  function updateMatchups(next) {
    setMatchups(next);
    try { localStorage.setItem(storeKey, JSON.stringify(next)); } catch (e) {}
  }
  function setSlot(i, side, val) {
    const next = matchups.map((m, j) => j === i ? { ...m, [side]: val } : m);
    updateMatchups(next);
  }
  const used = new Set();
  matchups.forEach(m => { if (m.a) used.add(m.a); if (m.b) used.add(m.b); });

  function MgrSelect({ value, onChange }) {
    return (
      <select value={value} onChange={e => onChange(e.target.value)} className="w-full bg-white border border-sky-200 rounded-md px-2 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400">
        <option value="">Select…</option>
        {ids.filter(id => id === value || !used.has(id)).map(id => <option key={id} value={id}>{mgrName(id)}</option>)}
      </select>
    );
  }

  async function exportPdf() {
    const src = document.getElementById('newsletter-doc');
    if (!src) return;
    if (!window.jspdf || !window.html2canvas) {
      alert('PDF library did not load. Check your connection and refresh the page.');
      return;
    }
    setExporting(true);
    const lg = getLeague(leagueId);
    const fname = `${(lg ? lg.name : 'league').replace(/[^a-z0-9]+/gi, '-')}-Week-${week}-Newsletter.pdf`;
    // Render an off-screen copy at a fixed width so scroll position and layout never affect the capture.
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;left:-10000px;top:0;width:760px;background:#fff;';
    const clone = src.cloneNode(true);
    clone.style.margin = '0';
    clone.style.maxWidth = '760px';
    clone.style.width = '760px';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);
    try {
      if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
      const SCALE = 2;
      const canvas = await window.html2canvas(clone, { scale: SCALE, backgroundColor: '#ffffff', useCORS: true, scrollX: 0, scrollY: 0, windowWidth: 800 });
      // Measure the sections, then break pages only between them.
      const rootTop = clone.getBoundingClientRect().top;
      let units = Array.from(clone.querySelectorAll('.nl-avoid')).map(el => {
        const r = el.getBoundingClientRect();
        return { top: (r.top - rootTop) * SCALE, bottom: (r.bottom - rootTop) * SCALE, glue: el.getAttribute('data-glue') === '1' };
      });
      const groups = [];
      for (let i = 0; i < units.length; i++) {
        let u = { top: units[i].top, bottom: units[i].bottom };
        while (units[i].glue && i + 1 < units.length) { i++; u.bottom = units[i].bottom; if (!units[i].glue) break; }
        groups.push(u);
      }
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'letter', orientation: 'portrait' });
      const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const mmPerPx = (pageW - margin * 2) / canvas.width;
      const maxPx = (pageH - margin * 2) / mmPerPx;
      const pages = [];
      let cur = null;
      groups.forEach(g => {
        if (!cur) { cur = { start: g.top, end: g.bottom }; return; }
        if (g.bottom - cur.start > maxPx) { pages.push(cur); cur = { start: g.top, end: g.bottom }; }
        else cur.end = g.bottom;
      });
      if (cur) pages.push(cur);
      const pad = 2 * SCALE;
      pages.forEach((pg, idx) => {
        const y0 = Math.max(0, Math.floor(pg.start - pad));
        const y1 = Math.min(canvas.height, Math.ceil(Math.min(pg.end + pad, pg.start + maxPx)));
        const h = Math.max(1, y1 - y0);
        const slice = document.createElement('canvas');
        slice.width = canvas.width; slice.height = h;
        const ctx = slice.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, slice.width, slice.height);
        ctx.drawImage(canvas, 0, y0, canvas.width, h, 0, 0, canvas.width, h);
        if (idx > 0) pdf.addPage();
        pdf.addImage(slice.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, pageW - margin * 2, h * mmPerPx);
        pdf.setFontSize(8); pdf.setTextColor(148, 163, 184);
        pdf.text(`${lg ? lg.name : ''} · Week ${week} · Page ${idx + 1} of ${pages.length}`, pageW / 2, pageH - 5, { align: 'center' });
      });
      pdf.save(fname);
    } catch (err) {
      alert('Could not build the PDF: ' + (err && err.message ? err.message : err));
    } finally {
      document.body.removeChild(wrap);
      setExporting(false);
    }
  }

  return (
    <div className="mt-10 pt-8 border-t border-sky-100">
      <div className="mb-6">
        <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-1">Commissioner Tools</p>
        <h2 className="font-serif text-2xl text-slate-800">📰 Weekly Newsletter Builder</h2>
      </div>

      <p className="text-xs text-slate-400 mb-4">
        {live.parsed.diag.weeks.length ? `Using sheet results through Week ${live.parsed.diag.weeks[live.parsed.diag.weeks.length - 1]}.` : 'No sheet results loaded yet.'}
      </p>

      <div className="bg-white border border-sky-100 rounded-lg shadow-gold-glow p-5 mb-6">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
          <div className="sm:col-span-2">
            <label className="block text-xs text-slate-500 mb-1">League</label>
            <select value={leagueId} onChange={e => setLeagueId(e.target.value)} className="w-full bg-white border border-sky-200 rounded-md px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400">
              {availableLeagues.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs text-slate-500 mb-1">Week</label>
            <select value={week} onChange={e => setWeek(parseInt(e.target.value, 10))} className="w-full bg-white border border-sky-200 rounded-md px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400">
              {Array.from({ length: 18 }, (_, i) => i + 1).map(w => <option key={w} value={w}>Week {w}</option>)}
            </select>
          </div>
        </div>

        {(PLAYOFF_CFG[leagueId] || LAST_CFG[leagueId]) ? (
          <div className="mb-5 flex flex-wrap items-center gap-3 text-xs text-slate-600">
            <span>{PLAYOFF_CFG[leagueId] ? `Playoff odds on: ${PLAYOFF_CFG[leagueId].spots} teams, top ${PLAYOFF_CFG[leagueId].byes} get byes.` : 'League odds on: chance to win the league (best final record), then chance of finishing last (buys dinner).'}</span>
            <label className="flex items-center gap-2">{DUAL_SCORING[leagueId] ? 'Regular-season results (14 wks × 2):' : 'Regular-season games:'}
              <input type="number" min="1" max="40" value={regGames} onChange={e => setRegGames(Math.max(1, parseInt(e.target.value, 10) || 1))} className="w-16 border border-sky-200 rounded px-2 py-1" />
            </label>
          </div>
        ) : <p className="mb-5 text-xs text-slate-400">Odds are included for Horner, Battle of the Sexes (playoffs) and Jon Bought Dinner (league race).</p>}

        <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-3">Matchups</p>
        <div className="space-y-3">
          {matchups.map((m, i) => (
            <div key={i} className="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
              <MgrSelect value={m.a} onChange={v => setSlot(i, 'a', v)} />
              <span className="text-amber-600 font-serif text-sm">VS</span>
              <MgrSelect value={m.b} onChange={v => setSlot(i, 'b', v)} />
            </div>
          ))}
        </div>
        <div className="mt-4 flex flex-wrap gap-3">
          <button onClick={() => updateMatchups(matchups.map(() => ({ a: '', b: '' })))} className="text-xs border border-slate-200 text-slate-500 hover:text-slate-800 rounded-md px-3 py-1.5">Clear matchups</button>
          <button onClick={exportPdf} disabled={exporting} className="text-sm bg-gradient-to-b from-amber-400 to-amber-600 text-white font-serif font-bold px-5 py-2 rounded-md shadow-sm hover:brightness-105 disabled:opacity-50">
            {exporting ? 'Building PDF…' : '⬇ Download Newsletter PDF'}
          </button>
        </div>
      </div>

      <p className="text-slate-400 text-xs uppercase tracking-widest mb-2">Preview</p>
      <div className="border border-sky-100 rounded-lg shadow-gold-glow bg-white overflow-x-auto">
        <NewsletterDoc leagueId={leagueId} week={week} matchups={matchups} eff={eff} games={live.parsed.games} regGames={regGames} trades={trades || []} />
      </div>
    </div>
  );
}

function TradeLogger({ live, trades, setTrades }) {
  const blank = { league: 'work', week: '1', dateText: '', a: '', aAssets: '', b: '', bAssets: '', notes: '' };
  const [f, setF] = useState(blank);
  const [msg, setMsg] = useState('');
  const ids = useMemo(() => activeManagerIds(f.league, live.parsed.games), [f.league, live.parsed.games]);
  const set = (k, v) => setF(p => ({ ...p, [k]: v, ...(k === 'league' ? { a: '', b: '' } : {}) }));
  const inp = "w-full bg-white border border-sky-200 rounded-md px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400";
  const lbl = "block text-xs text-slate-500 mb-1";
  const valid = f.a && f.b && f.a !== f.b && f.aAssets.trim() && f.bAssets.trim();

  function submit(e) {
    e.preventDefault();
    if (!valid) return;
    const t = { id: 't' + Date.now() + Math.random().toString(36).slice(2, 6), ts: Date.now(), league: f.league, week: parseInt(f.week, 10) || 1, dateText: f.dateText.trim(), a: f.a, aAssets: f.aAssets.trim(), b: f.b, bAssets: f.bAssets.trim(), notes: f.notes.trim() };
    const next = [...trades, t];
    setTrades(next); saveTrades(next);
    setF({ ...blank, league: f.league, week: f.week });
    setMsg('Trade saved.');
    setTimeout(() => setMsg(''), 2500);
  }
  function del(id) {
    if (!window.confirm('Delete this trade?')) return;
    const next = trades.filter(t => t.id !== id);
    setTrades(next); saveTrades(next);
  }
  const recent = trades.slice().sort((x, y) => (y.ts || 0) - (x.ts || 0)).slice(0, 5);

  return (
    <div className="mt-10 pt-8 border-t border-sky-100">
      <div className="mb-6">
        <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-1">Commissioner Tools</p>
        <h2 className="font-serif text-2xl text-slate-800">🔄 Log New Trade</h2>
        <p className="text-slate-400 text-xs mt-1">Saved in this browser and shown on the public League Trades tab and in the newsletter.</p>
      </div>
      <form onSubmit={submit} className="bg-white border border-sky-100 rounded-lg shadow-gold-glow p-5 space-y-4">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div className="sm:col-span-1">
            <label className={lbl}>League</label>
            <select value={f.league} onChange={e => set('league', e.target.value)} className={inp}>
              {DATA.leagues.filter(l => TRADE_LEAGUES.includes(l.id)).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
          </div>
          <div>
            <label className={lbl}>Week</label>
            <select value={f.week} onChange={e => set('week', e.target.value)} className={inp}>
              {Array.from({ length: 18 }, (_, i) => i + 1).map(w => <option key={w} value={w}>Week {w}</option>)}
            </select>
          </div>
          <div>
            <label className={lbl}>Date (optional)</label>
            <input type="text" value={f.dateText} onChange={e => set('dateText', e.target.value)} placeholder="e.g. Nov 3" className={inp} />
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label className={lbl}>Team A</label>
            <select value={f.a} onChange={e => set('a', e.target.value)} className={inp}>
              <option value="">Select…</option>
              {ids.filter(id => id !== f.b).map(id => <option key={id} value={id}>{mgrName(id)}</option>)}
            </select>
          </div>
          <div>
            <label className={lbl}>Team B</label>
            <select value={f.b} onChange={e => set('b', e.target.value)} className={inp}>
              <option value="">Select…</option>
              {ids.filter(id => id !== f.a).map(id => <option key={id} value={id}>{mgrName(id)}</option>)}
            </select>
          </div>
          <div>
            <label className={lbl}>Assets sent by Team A</label>
            <input type="text" value={f.aAssets} onChange={e => set('aAssets', e.target.value)} placeholder="Players, draft picks, etc." className={inp} />
          </div>
          <div>
            <label className={lbl}>Assets sent by Team B</label>
            <input type="text" value={f.bAssets} onChange={e => set('bAssets', e.target.value)} placeholder="Players, draft picks, etc." className={inp} />
          </div>
        </div>
        <div>
          <label className={lbl}>Commish notes (optional)</label>
          <textarea rows="2" value={f.notes} onChange={e => set('notes', e.target.value)} className={inp} />
        </div>
        <div className="flex items-center gap-3">
          <button type="submit" disabled={!valid} className="text-sm bg-gradient-to-b from-amber-400 to-amber-600 text-white font-serif font-bold px-5 py-2 rounded-md shadow-sm hover:brightness-105 disabled:opacity-40">Save Trade</button>
          {msg && <span className="text-emerald-600 text-sm">{msg}</span>}
        </div>
      </form>
      {recent.length > 0 && (
        <div className="mt-6">
          <p className="text-slate-400 text-xs uppercase tracking-widest mb-2">Recently logged ({trades.length} total)</p>
          <div className="space-y-3">
            {recent.map(t => (
              <div key={t.id}>
                <p className="text-[11px] text-slate-400 mb-1">{(getLeague(t.league) || {}).name}</p>
                <TradeCard t={t} onDelete={del} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

   ========================================================= */
function PinManager() {
  const [pins, setPins] = useState(currentPins());
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(pins);
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');
  const rows = [
    ...DATA.leagues.map(l => ({ key: l.id, label: l.name })),
    { key: 'master', label: 'Master PIN (commissioner override, unlocks everything)' },
    { key: 'masterViewer', label: 'Master viewer PIN (unlocks only the Master leaderboard)' },
  ];
  function save() {
    const vals = rows.map(r => draft[r.key]);
    if (vals.some(v => !/^\d{4}$/.test(v))) { setErr('Every PIN must be exactly 4 digits.'); return; }
    if (new Set(vals).size !== vals.length) { setErr('Each PIN must be unique.'); return; }
    applyPins(draft);
    try { localStorage.setItem(PINS_KEY, JSON.stringify(draft)); } catch (e) {}
    setPins(currentPins()); setEditing(false); setErr('');
    setMsg('PINs saved.'); setTimeout(() => setMsg(''), 2500);
  }
  function reset() {
    if (!window.confirm('Reset all PINs to the original defaults?')) return;
    applyPins(null);
    try { localStorage.removeItem(PINS_KEY); } catch (e) {}
    setPins(currentPins()); setEditing(false); setErr('');
  }
  return (
    <div className="mt-10 pt-8 border-t border-sky-100">
      <div className="mb-6">
        <p className="text-sky-600 text-xs uppercase tracking-widest font-semibold mb-1">Commissioner Tools</p>
        <h2 className="font-serif text-2xl text-slate-800">🔑 League &amp; Master PINs</h2>
        <p className="text-slate-400 text-xs mt-1">Changes are saved in this browser only. Other devices keep using the PINs built into the file.</p>
      </div>
      <div className="bg-white border border-sky-100 rounded-lg shadow-gold-glow p-5">
        <div className="divide-y divide-sky-50">
          {rows.map(r => (
            <div key={r.key} className="flex items-center justify-between gap-4 py-2.5">
              <span className="text-sm text-slate-700">{r.label}</span>
              {editing ? (
                <input type="text" inputMode="numeric" maxLength="4" value={draft[r.key]} onChange={e => setDraft({ ...draft, [r.key]: e.target.value.replace(/\D/g, '') })} className="w-20 text-center font-mono border border-sky-200 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-sky-400" />
              ) : (
                <span className="font-mono text-sky-700 font-bold tracking-widest">{pins[r.key]}</span>
              )}
            </div>
          ))}
        </div>
        {err && <p className="text-red-500 text-xs mt-3">{err}</p>}
        <div className="mt-4 flex flex-wrap items-center gap-3">
          {editing ? (
            <React.Fragment>
              <button onClick={save} className="text-sm bg-gradient-to-b from-amber-400 to-amber-600 text-white font-serif font-bold px-5 py-2 rounded-md shadow-sm hover:brightness-105">Save PINs</button>
              <button onClick={() => { setEditing(false); setErr(''); }} className="text-xs border border-slate-200 text-slate-500 hover:text-slate-800 rounded-md px-3 py-2">Cancel</button>
            </React.Fragment>
          ) : (
            <button onClick={() => { setDraft(pins); setEditing(true); setMsg(''); }} className="text-sm bg-gradient-to-b from-amber-400 to-amber-600 text-white font-serif font-bold px-5 py-2 rounded-md shadow-sm hover:brightness-105">Edit PINs</button>
          )}
          <button onClick={reset} className="text-xs border border-slate-200 text-slate-500 hover:text-slate-800 rounded-md px-3 py-2">Reset to defaults</button>
          {msg && <span className="text-emerald-600 text-sm">{msg}</span>}
        </div>
      </div>
    </div>
  );
}

          ))}
          <button
            onClick={() => onSwitch('trades')}
            className={
              "px-3 py-1.5 rounded-md text-xs font-serif tracking-wide whitespace-nowrap transition border " +
              (currentId === 'trades'
                ? "bg-amber-50 border-amber-300 text-amber-700"
                : "border-transparent text-slate-400 hover:text-amber-700 hover:border-amber-200")
            }
          >
            🔄 League Trades
          </button>
          {admin && (
            <button
              onClick={() => onSwitch('settings')}
              className={
                "px-3 py-1.5 rounded-md text-xs font-serif tracking-wide whitespace-nowrap transition border " +
                (currentId === 'settings'
                  ? "bg-slate-100 border-slate-300 text-slate-700"
                  : "border-transparent text-slate-400 hover:text-slate-700 hover:border-slate-200")
              }
            >
              ⚙️ Settings
            </button>
          )}
        </div>
        <button
          onClick={onLock}
          className="text-xs border border-sky-200 text-slate-500 hover:text-slate-800 hover:border-sky-400 rounded-md px-3 py-1.5 whitespace-nowrap"
        >
          🔒 Lock / Change Vault
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [unlocked, setUnlocked] = useState(loadUnlocked());
  const [view, setView] = useState(() => {
    const u = loadUnlocked();
    if (u.length === 0) return null;
    return u.includes('master') ? 'master' : u[0];
  });
  const [admin, setAdmin] = useState(() => { try { return localStorage.getItem(ADMIN_KEY) === '1'; } catch (e) { return false; } });
  const [pinTarget, setPinTarget] = useState(null);
  const [includeAlumni, setIncludeAlumni] = useState(false);
  const [selectedManager, setSelectedManager] = useState(null);
  const [trades, setTrades] = useState(() => loadTrades());

  // ---- live sheet state ----
  const initPrefs = useMemo(() => loadPrefs(), []);
  const [includeLive, setIncludeLiveRaw] = useState(initPrefs.includeLive);
  const [overrides, setOverridesRaw] = useState(initPrefs.overrides);
  const [csvText, setCsvText] = useState(() => { try { return localStorage.getItem(LIVE_CSV_KEY) || ''; } catch (e) { return ''; } });
  const [status, setStatus] = useState({ state: 'idle', error: null, fetchedAt: null });

  function persistPrefs(patch) {
    savePrefs({ includeLive, overrides, ...patch });
  }
  const setIncludeLive = v => { setIncludeLiveRaw(v); persistPrefs({ includeLive: v }); };
  const setOverride = (id, v) => {
    const next = { ...overrides };
    if (v === '' || isNaN(parseInt(v, 10))) delete next[id]; else next[id] = String(Math.max(0, parseInt(v, 10)));
    setOverridesRaw(next); persistPrefs({ overrides: next });
  };

  async function refresh() {
    setStatus(s => ({ ...s, state: 'loading', error: null }));
    try {
      const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('sheet is not published as CSV');
      setCsvText(text);
      try { localStorage.setItem(LIVE_CSV_KEY, text); } catch (e) {}
      setStatus({ state: 'ok', error: null, fetchedAt: new Date() });
    } catch (err) {
      setStatus(s => ({ state: 'error', error: err.message || 'network error', fetchedAt: s.fetchedAt }));
    }
  }
  function applyPaste(text) {
    setCsvText(text);
    try { localStorage.setItem(LIVE_CSV_KEY, text); } catch (e) {}
    setStatus({ state: 'ok', error: null, fetchedAt: new Date() });
  }
  useEffect(() => { refresh(); }, []);

  const parsed = useMemo(() => parseLive(csvText), [csvText]);
  const detected = useMemo(() => detectBaselines(parsed.games), [parsed]);
  const baselines = useMemo(() => {
    const o = {};
    DATA.leagues.forEach(l => {
      const ov = overrides[l.id];
      o[l.id] = (ov !== undefined && ov !== '' && !isNaN(parseInt(ov, 10))) ? { weeks: parseInt(ov, 10), reason: 'manual' } : (detected[l.id] || { weeks: 0, reason: '' });
    });
    return o;
  }, [detected, overrides]);
  const calcGames = useMemo(() => (includeLive ? parsed.games.filter(g => g.week > ((baselines[g.league] || {}).weeks || 0)) : []), [parsed, includeLive, baselines]);
  const eff = useMemo(() => applyLive(calcGames), [calcGames]);
  const live = { parsed, status, refresh, includeLive, setIncludeLive, baselines, detected, overrides, setOverride, applyPaste };

  function handleUnlockSuccess(exhibit, mode) {
    let next;
    if (exhibit.id === 'master' && mode === 'all') {
      next = Array.from(new Set([...unlocked, ...ALL_EXHIBITS.map(e => e.id)]));
    } else {
      next = Array.from(new Set([...unlocked, exhibit.id]));
    }
    if (exhibit.id === 'master' && mode === 'all') {
      setAdmin(true);
      try { localStorage.setItem(ADMIN_KEY, '1'); } catch (e) {}
    }
    setUnlocked(next);
    saveUnlocked(next);
    setView(exhibit.id);
    setPinTarget(null);
  }

  function handleSelectExhibit(exhibit) {
    if (unlocked.includes(exhibit.id)) {
      setView(exhibit.id);
    } else {
      setPinTarget(exhibit);
    }
  }

  function handleLock() {
    try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(ADMIN_KEY); } catch (e) {}
    setAdmin(false);
    setUnlocked([]);
    setView(null);
  }

  const currentExhibit = ALL_EXHIBITS.find(e => e.id === view) || null;

  let body;
  if (view === 'settings' && admin) {
    body = <SettingsView live={live} unlocked={unlocked} eff={eff} trades={trades} setTrades={setTrades} />;
  } else if (view === 'trades' && unlocked.length > 0) {
    body = <TradesView trades={trades} unlocked={unlocked} />;
  } else if (!view || !currentExhibit) {
    body = <Lobby unlocked={unlocked} onSelect={handleSelectExhibit} admin={admin} onSettings={() => setView('settings')} />;
  } else {
    body = (
      <ExhibitView
        key={currentExhibit.id}
        exhibit={currentExhibit}
        includeAlumni={includeAlumni}
        setIncludeAlumni={setIncludeAlumni}
        onSelectManager={setSelectedManager}
        eff={eff}
        live={live}
      />
    );
  }

  return (
    <div className="min-h-screen">
      {unlocked.length > 0 && (
        <Header
          unlocked={unlocked}
          currentId={view}
          onSwitch={setView}
          onLock={handleLock}
          onGoLobby={() => setView(null)}
          admin={admin}
        />
      )}

      {body}

      {pinTarget && (
        <PinModal
          exhibit={pinTarget}
          onClose={() => setPinTarget(null)}
          onSuccess={handleUnlockSuccess}
        />
      )}

      {selectedManager && (
        <ManagerPlaqueModal
          managerId={selectedManager}
          eff={eff}
          onClose={() => setSelectedManager(null)}
        />
      )}

      <footer className="text-center text-slate-300 text-xs py-10">
        Fantasy Sports Hall of Fame & Museum — Est. this season · Live results sync from the weekly Google Sheet.
      </footer>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="max-w-xl mx-auto p-10 text-center">
        <h2 className="font-serif text-2xl text-slate-800 mb-2">Something went wrong</h2>
        <p className="text-slate-500 text-sm mb-4">{String(this.state.err && this.state.err.message || this.state.err)}</p>
        <button onClick={() => window.location.reload()} className="text-sm border border-sky-300 text-sky-700 rounded-md px-4 py-2">Reload</button>
      </div>
    );
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
